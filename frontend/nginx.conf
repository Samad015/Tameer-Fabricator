server {
 listen 8080;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 server_tokens off;
 client_max_body_size 32k;
 add_header X-Content-Type-Options nosniff always;
 add_header X-Frame-Options DENY always;
 add_header Referrer-Policy strict-origin-when-cross-origin always;
 add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://va.vercel-scripts.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
 location = /healthz { access_log off; return 200 'ok'; }
 location /api/ {
  proxy_pass http://backend:5001;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_connect_timeout 5s;
  proxy_read_timeout 60s;
 }
 location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
 location / { try_files $uri $uri/ /index.html; }
}
